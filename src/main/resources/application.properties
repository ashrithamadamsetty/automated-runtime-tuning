spring.application.name=automated-runtime-tuning

# ---------------------------------------------------------------------------
# Datasource / HikariCP
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/autotuning
spring.datasource.username=postgres
spring.datasource.password=Sep@13Ot2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=autotuning-pool
spring.datasource.hikari.register-mbeans=true
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
# Embedded Tomcat
# ---------------------------------------------------------------------------
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.mbeanregistry.enabled=true

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true

# ---------------------------------------------------------------------------
# Automated runtime tuning
# ---------------------------------------------------------------------------
tuning.enabled=true
tuning.interval=PT10S
tuning.metrics.endpoint-enabled=true

# ---------------------------------------------------------------------------
# Thread pool - ENABLED for this test
# ---------------------------------------------------------------------------
tuning.thread-pool.enabled=false
tuning.thread-pool.reverse-acting=true
tuning.thread-pool.target=70
tuning.thread-pool.kp=0.5
tuning.thread-pool.ki=0.05
tuning.thread-pool.kd=0.1
tuning.thread-pool.integral-limit=100
tuning.thread-pool.min=20
tuning.thread-pool.max=400
tuning.thread-pool.max-step=25
tuning.thread-pool.deadband=5
tuning.thread-pool.cooldown=PT30S
tuning.thread-pool.default-value=200

# ---------------------------------------------------------------------------
# Database pool - DISABLED
# ---------------------------------------------------------------------------
tuning.database-pool.enabled=false
tuning.database-pool.reverse-acting=true
tuning.database-pool.target=70
tuning.database-pool.kp=0.05
tuning.database-pool.ki=0.005
tuning.database-pool.kd=0.005
tuning.database-pool.integral-limit=100
tuning.database-pool.min=2
tuning.database-pool.max=20
tuning.database-pool.max-step=2
tuning.database-pool.deadband=10
tuning.database-pool.cooldown=PT30S
tuning.database-pool.default-value=10
tuning.database-pool.dba-max-connections=20

# ---------------------------------------------------------------------------
# Rate limiter - DISABLED
# ---------------------------------------------------------------------------
tuning.rate-limiter.enabled=true
tuning.rate-limiter.reverse-acting=false
tuning.rate-limiter.target=70
tuning.rate-limiter.kp=0.6
tuning.rate-limiter.ki=0.05
tuning.rate-limiter.kd=0.05
tuning.rate-limiter.integral-limit=200
tuning.rate-limiter.min=10
tuning.rate-limiter.max=5000
tuning.rate-limiter.max-step=50
tuning.rate-limiter.deadband=5
tuning.rate-limiter.cooldown=PT15S
tuning.rate-limiter.default-value=200

# ---------------------------------------------------------------------------
# Backpressure
# ---------------------------------------------------------------------------
tuning.backpressure.enabled=true
tuning.backpressure.pending-connection-threshold=1
tuning.backpressure.shed-factor=0.8

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.opentext.automatedruntimetuning=INFO